#name=templates/users/access_denied.html
{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
  <div class="alert alert-warning">
    <h4 class="alert-heading">Access Denied</h4>
    <p>You do not have permission to view this page. If you believe this is an error, contact an administrator.</p>
    <hr>
    <a class="btn btn-primary" href="{% url 'users:login' %}">Return to login</a>
  </div>
{% endblock %}
